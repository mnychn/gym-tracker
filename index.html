<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Swole Cat</title>
  <meta name="description" content="Track workouts, weights, sets, reps and rest.">
  <meta name="theme-color" content="#6a3de8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#3d1fb0" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Swole Cat">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main id="view" class="view"></main>
  <div id="restbar" class="restbar" hidden></div>
  <nav class="tabs" id="tabs">
    <button data-tab="train"><svg viewBox="0 0 24 24"><rect class="f" x="4" y="7.5" width="4" height="9" rx="2"/><rect class="f" x="16" y="7.5" width="4" height="9" rx="2"/><path d="M8 12h8M2.5 10.5v3M21.5 10.5v3"/><path class="sp" d="M19.5 2.5v2.6M18.2 3.8h2.6"/></svg><span>Train</span></button>
    <button data-tab="history"><svg viewBox="0 0 24 24"><rect class="f" x="3.5" y="5" width="17" height="15.5" rx="4.5"/><path d="M8 3v3.6M16 3v3.6"/><path class="solid" d="M12 17.4s-3.7-2.2-3.7-4.6a1.95 1.95 0 0 1 3.7-.9 1.95 1.95 0 0 1 3.7.9c0 2.4-3.7 4.6-3.7 4.6z"/></svg><span>History</span></button>
    <button data-tab="body"><svg viewBox="0 0 24 24"><path d="M5 19.5c-.8-2.6-1-5.6-.6-8.3L5.6 4l4.2 3.6c1.4-.4 3-.4 4.4 0L18.4 4l1.2 7.2c.4 2.7.2 5.7-.6 8.3z"/><path d="M10 13.2h.01M14 13.2h.01" stroke-width="2.6"/></svg><span>Body</span></button>
    <button data-tab="mood"><svg viewBox="0 0 24 24"><circle class="f" cx="12" cy="12" r="8.6"/><path d="M8.4 14.2c1.9 2.3 5.3 2.3 7.2 0"/><path d="M9.2 10h.01M14.8 10h.01" stroke-width="2.6"/></svg><span>Mood</span></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><path class="f" d="M12 3.2a2.6 2.6 0 0 1 2.4 1.6 2.6 2.6 0 0 1 3.4 1.4 2.6 2.6 0 0 1 1.4 3.4 2.6 2.6 0 0 1 0 4.8 2.6 2.6 0 0 1-1.4 3.4 2.6 2.6 0 0 1-3.4 1.4 2.6 2.6 0 0 1-4.8 0 2.6 2.6 0 0 1-3.4-1.4 2.6 2.6 0 0 1-1.4-3.4 2.6 2.6 0 0 1 0-4.8 2.6 2.6 0 0 1 1.4-3.4 2.6 2.6 0 0 1 3.4-1.4A2.6 2.6 0 0 1 12 3.2z"/><circle cx="12" cy="12" r="3"/></svg><span>Settings</span></button>
  </nav>
  <button id="fab" class="fab" data-act="quick-add" aria-label="Log something" hidden><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="seed.js"></script>
  <script src="guides.js"></script>
  <script src="anim.js"></script>
  <script src="art.js"></script>
  <script src="app.js"></script>
</body>
</html>
