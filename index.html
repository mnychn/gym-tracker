<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gym Log</title>
  <meta name="description" content="Track workouts, weights, sets, reps and rest.">
  <meta name="theme-color" content="#f4f3fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16141f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Log">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main id="view" class="view"></main>
  <div id="restbar" class="restbar" hidden></div>
  <nav class="tabs" id="tabs">
    <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg><span>Train</span></button>
    <button data-tab="history"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>History</span></button>
    <button data-tab="body"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.8" r="2.3"/><path d="M5 9h14M12 9v6M12 15l-3.5 6M12 15l3.5 6"/></svg><span>Body</span></button>
    <button data-tab="routine"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span>Routine</span></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2 5.5 5.5"/></svg><span>Settings</span></button>
  </nav>
  <button id="fab" class="fab" data-act="quick-add" aria-label="Log something" hidden><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="seed.js"></script>
  <script src="guides.js"></script>
  <script src="anim.js"></script>
  <script src="app.js"></script>
</body>
</html>
